name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-migrations.yml'
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Les secrets sont lus au niveau du job pour pouvoir être testés dans les `if` des étapes.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # La référence du projet n'est pas secrète : valeur par défaut si le secret n'existe pas.
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'wjaiofzrzorxtvrulplc' }}

    steps:
      - name: Check secrets
        id: check
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::warning title=Migrations non déployées::Secrets manquants :$missing (GitHub → Settings → Secrets and variables → Actions)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        if: steps.check.outputs.ready == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link project
        if: steps.check.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Pending migrations
        if: steps.check.outputs.ready == 'true'
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"

      - name: Push migrations
        if: steps.check.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
